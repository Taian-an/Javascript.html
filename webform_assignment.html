<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add New Item</title>
</head>
<body>
    <h1>Add New Item</h1>
    <form action="https://athiphat-mybackend-01.southeastasia.cloudapp.azure.com/api/product" 
          method="POST" enctype="multipart/form-data">
        
        <!-- General Info -->
        <fieldset>
            <legend>General Info</legend>
            <p>
                <label for="itemName">Item Name:</label>
                <input type="text" id="itemName" name="itemName" size="50" maxlength="500" 
                       value="Sample Item">
            </p>
            <p>
                <label for="itemDescription">Item Description:</label><br>
                <textarea id="itemDescription" name="itemDescription" rows="4" cols="50">
This is a sample item description.
                </textarea>
            </p>
            <p>
                <label for="coverImage">Cover Image:</label>
                <input type="file" id="coverImage" name="coverImage">
            </p>
        </fieldset>

        <!-- Misc. -->
        <fieldset>
            <legend>Misc.</legend>
            <p>
                <label for="category">Category:</label>
                <select id="category" name="category">
                    <option value="notSpecified">Not Specified</option>
                    <option value="consumption">Consumption</option>
                    <option value="household">Household</option>
                    <option value="electronic">Electronic</option>
                    <option value="gadget">Gadget</option>
                </select>
            </p>
            <p>
                <label for="inventoryAmount">Inventory Amount:</label>
                <input type="number" id="inventoryAmount" name="inventoryAmount" value="10" min="0">
            </p>
            <p>
                <label for="listPrice">List Price:</label>
                <input type="number" id="listPrice" name="listPrice" value="999" min="0">
            </p>
        </fieldset>

        <!-- Availability -->
        <fieldset>
            <legend>Availability</legend>
            <p>Available in store:</p>
            <label><input type="checkbox" name="availableStore[]" value="Bangkok"> Bangkok</label><br>
            <label><input type="checkbox" name="availableStore[]" value="Pattaya"> Pattaya</label><br>
            <label><input type="checkbox" name="availableStore[]" value="Phuket"> Phuket</label>
        </fieldset>

        <!-- Status -->
        <fieldset>
            <legend>Status</legend>
            <label><input type="radio" name="status" value="Active" checked> Active</label><br>
            <label><input type="radio" name="status" value="Inactive"> Inactive</label>
        </fieldset>

        <!-- Staff Email -->
        <fieldset>
            <legend>Staff Info</legend>
            <p>
                <label for="staffEmail">Staff Email:</label>
                <input type="email" id="staffEmail" name="staffEmail" value="yourstudentemail@example.com">
            </p>
        </fieldset>

        <button type="submit">Submit Form</button>
    </form>
</body>
</html>
