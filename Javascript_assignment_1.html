<html> 
  <body> 
    <ul id="list1"></ul> 
    <script> 
      // Loop from 1 to 20
      for (let i = 1; i <= 20; i++) {
        
        // Check if the current number is 5, 10, or 15
        if (i === 5 || i === 10 || i === 15) {
          continue; // Skip this iteration
        }

        // Append the list item to the element with id "list1"
        // Note: We use <li> (List Item) for the content inside the <ul>
        document.getElementById("list1").innerHTML += `<li>${i}</li>`; 
      }
    </script> 
  </body> 
</html>
